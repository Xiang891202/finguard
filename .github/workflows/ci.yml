name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  docs-check:
    name: 文件檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 檢查 Markdown 檔案格式
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            docs/**/*.md
            README.md
          config: '.markdownlint.json'
        continue-on-error: true

      - name: 檢查連結
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path .lycheeignore 'docs/**/*.md' 'README.md'
        continue-on-error: true

  backend-check:
    name: 後端檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 檢查後端程式碼是否存在
        id: check
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 設定 Python
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝依賴
        if: steps.check.outputs.exists == 'true'
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy

      - name: Lint（ruff）
        if: steps.check.outputs.exists == 'true'
        run: |
          cd backend
          ruff check . || echo "::warning::ruff 檢查失敗"
        continue-on-error: true

      - name: 單元測試
        if: steps.check.outputs.exists == 'true'
        run: |
          cd backend
          pytest tests/unit/ --cov=app --cov-report=term-missing --cov-fail-under=80
        continue-on-error: true

  frontend-check:
    name: 前端檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 檢查前端程式碼是否存在
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 設定 Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安裝依賴
        if: steps.check.outputs.exists == 'true'
        run: |
          cd frontend
          npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: |
          cd frontend
          npm run lint || echo "::warning::ESLint 檢查失敗"
        continue-on-error: true

      - name: 建置測試
        if: steps.check.outputs.exists == 'true'
        run: |
          cd frontend
          npm run build
        continue-on-error: true

  docker-check:
    name: Docker 設定檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 驗證 docker-compose 設定
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config
          else
            echo "⏭️ 尚無 docker-compose.yml"
          fi

  security-check:
    name: 安全掃描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 檢查敏感檔案未進 Git
        run: |
          if git ls-files | grep -E '^\.env$|/\.env$' | grep -v '.env.example'; then
            echo "::error::發現 .env 檔案進入 Git！"
            exit 1
          fi
          echo "✅ 無敏感檔案"

  ci-summary:
    name: CI 總結
    runs-on: ubuntu-latest
    needs: [docs-check, security-check]
    if: always()
    steps:
      - name: 檢查結果
        run: |
          echo "📊 CI 執行結果"
          echo "文件檢查：${{ needs.docs-check.result }}"
          echo "安全掃描：${{ needs.security-check.result }}"
          
          if [ "${{ needs.docs-check.result }}" = "failure" ] || \
             [ "${{ needs.security-check.result }}" = "failure" ]; then
            echo "::error::CI 失敗"
            exit 1
          fi
          echo "✅ CI 通過"