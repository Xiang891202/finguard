name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================
  # 文件檢查（永遠執行）
  # ============================================
  docs-check:
    name: 文件檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 檢查 Markdown 檔案格式
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            docs/**/*.md
            README.md
        continue-on-error: true

      - name: 檢查連結
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress 'docs/**/*.md' 'README.md'
        continue-on-error: true

  # ============================================
  # 後端檢查（P0 完成後自動啟用）
  # ============================================
  backend-check:
    name: 後端檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 檢查後端程式碼是否存在
        id: check
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ 偵測到後端程式碼，執行檢查"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⏭️ 尚無後端程式碼，跳過檢查"
          fi

      - name: 設定 Python
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝依賴
        if: steps.check.outputs.exists == 'true'
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy

      - name: Lint（ruff）
        if: steps.check.outputs.exists == 'true'
        run: |
          cd backend
          ruff check . || echo "::warning::ruff 檢查失敗"

      - name: 型別檢查（mypy）
        if: steps.check.outputs.exists == 'true'
        run: |
          cd backend
          mypy app/ || echo "::warning::mypy 檢查失敗"
        continue-on-error: true

      - name: 單元測試
        if: steps.check.outputs.exists == 'true'
        run: |
          cd backend
          pytest tests/unit/ --cov=app --cov-report=term-missing --cov-fail-under=80
        continue-on-error: true

  # ============================================
  # 前端檢查（P0 完成後自動啟用）
  # ============================================
  frontend-check:
    name: 前端檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 檢查前端程式碼是否存在
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ 偵測到前端程式碼，執行檢查"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⏭️ 尚無前端程式碼，跳過檢查"
          fi

      - name: 設定 Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安裝依賴
        if: steps.check.outputs.exists == 'true'
        run: |
          cd frontend
          npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: |
          cd frontend
          npm run lint || echo "::warning::ESLint 檢查失敗"
        continue-on-error: true

      - name: 單元測試
        if: steps.check.outputs.exists == 'true'
        run: |
          cd frontend
          npm run test:unit -- --run
        continue-on-error: true

      - name: 建置測試
        if: steps.check.outputs.exists == 'true'
        run: |
          cd frontend
          npm run build
        continue-on-error: true

  # ============================================
  # Docker 建置測試（永遠執行，因為 docker-compose.yml 一定存在）
  # ============================================
  docker-check:
    name: Docker 設定檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 檢查 docker-compose.yml 是否存在
        id: check
        run: |
          if [ -f docker-compose.yml ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ 偵測到 docker-compose.yml"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⏭️ 尚無 docker-compose.yml，跳過檢查"
          fi

      - name: 設定 Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 驗證 docker-compose 設定
        if: steps.check.outputs.exists == 'true'
        run: |
          docker compose config

      - name: 建置後端映像（若有 Dockerfile）
        if: steps.check.outputs.exists == 'true'
        run: |
          if [ -f backend/Dockerfile ]; then
            docker build -t finguard-backend:test ./backend
          else
            echo "⏭️ 尚無後端 Dockerfile，跳過"
          fi
        continue-on-error: true

      - name: 建置前端映像（若有 Dockerfile）
        if: steps.check.outputs.exists == 'true'
        run: |
          if [ -f frontend/Dockerfile ]; then
            docker build -t finguard-frontend:test ./frontend
          else
            echo "⏭️ 尚無前端 Dockerfile，跳過"
          fi
        continue-on-error: true

  # ============================================
  # 安全掃描（永遠執行）
  # ============================================
  security-check:
    name: 安全掃描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 檢查敏感檔案未進 Git
        run: |
          if git ls-files | grep -E '^\.env$|/\.env$' | grep -v '.env.example'; then
            echo "::error::發現 .env 檔案進入 Git！"
            exit 1
          fi
          echo "✅ 無敏感檔案"

      - name: 依賴漏洞掃描（Python）
        run: |
          if [ -f backend/requirements.txt ]; then
            pip install pip-audit
            pip-audit -r backend/requirements.txt || true
          else
            echo "⏭️ 尚無後端依賴，跳過"
          fi
        continue-on-error: true

      - name: 依賴漏洞掃描（Node）
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm audit --audit-level=high || true
          else
            echo "⏭️ 尚無前端依賴，跳過"
          fi
        continue-on-error: true

  # ============================================
  # 總結
  # ============================================
  ci-summary:
    name: CI 總結
    runs-on: ubuntu-latest
    needs: [docs-check, security-check]
    if: always()
    steps:
      - name: 檢查結果
        run: |
          echo "📊 CI 執行結果"
          echo "文件檢查：${{ needs.docs-check.result }}"
          echo "安全掃描：${{ needs.security-check.result }}"
          
          if [ "${{ needs.docs-check.result }}" = "failure" ] || \
             [ "${{ needs.security-check.result }}" = "failure" ]; then
            echo "::error::CI 失敗"
            exit 1
          fi
          echo "✅ CI 通過"